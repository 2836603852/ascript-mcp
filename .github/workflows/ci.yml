name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + build tooling
        run: |
          python -m pip install --upgrade pip build
          pip install -e .

      - name: Import smoke test
        run: |
          python -c "import ascript_mcp; print('version:', ascript_mcp.__version__)"
          python -c "from ascript_mcp import local, server, device, api_store, examples"

      - name: Build distribution
        run: python -m build

      - name: Validate built wheel installs cleanly
        run: |
          python -m venv /tmp/fresh
          /tmp/fresh/bin/pip install dist/*.whl
          /tmp/fresh/bin/python -c "import ascript_mcp; print('installed:', ascript_mcp.__version__)"
