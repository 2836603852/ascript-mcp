name: Bug report
description: 报告一个 bug / Report a bug
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: 现象 / What happened
      description: 简述你看到的问题
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤 / Steps to reproduce
      placeholder: |
        1. 安装 ...
        2. 配置 ...
        3. 调用 ...
        4. 预期 ... / 实际 ...
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python 版本 / Python version
      placeholder: "3.11.9"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: 操作系统 / OS
      placeholder: "Ubuntu 22.04 / Windows 11 / macOS 14"
    validations:
      required: true

  - type: input
    id: package-version
    attributes:
      label: ascript-mcp 版本
      placeholder: "1.6.1"
    validations:
      required: true

  - type: input
    id: mcp-client
    attributes:
      label: MCP 客户端 / MCP client
      placeholder: "Claude Desktop / Cursor / Trae"

  - type: textarea
    id: logs
    attributes:
      label: 相关日志 / Logs
      render: shell
