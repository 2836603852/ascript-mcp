name: Feature request
description: 提出一个新功能或改进 / Propose a new feature or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 使用场景 / Use case
      description: 你想做什么？为什么现在做不到？
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望方案 / Proposed solution
      description: 你希望 API 长什么样？流程是什么？

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案 / Alternatives considered
